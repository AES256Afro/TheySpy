name: check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # BoxPilot's catalog validator checks boxpilot/theyspy.yaml. If the repository is not
      # reachable the step is skipped and the manifest still gets its local checks.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        continue-on-error: true
        with:
          repository: AES256Afro/BoxPilot
          path: .boxpilot
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          BOXPILOT_DIR: .boxpilot
      - name: The tag names this tree's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e 'const v = require("./package.json").version; if (process.env.GITHUB_REF_NAME !== `v${v}`) { console.error(`tag ${process.env.GITHUB_REF_NAME} but package.json says ${v}`); process.exit(1); }'

  container:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t theyspy:ci .
      - name: Container starts and answers /healthz
        run: |
          docker run -d --name theyspy -p 8797:8797 -e TS_IOC_AUTOCHECK=false theyspy:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8797/healthz && exit 0; sleep 1; done
          docker logs theyspy; exit 1

  # A version tag publishes ghcr.io/aes256afro/theyspy:<version>, the image BoxPilot's catalog
  # pins by digest. Same pipeline as BaselineWatch: signed keylessly with Sigstore, with an SBOM
  # and build provenance attached.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing with Sigstore
      attestations: write # GitHub's build-provenance attestation
    env:
      IMAGE: ghcr.io/aes256afro/theyspy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The container driver: the default docker driver cannot attach attestations to a push.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Write the SBOM (SPDX) for the image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
      - name: Attach the SBOM to the image as a signed attestation
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Digest for BoxPilot's catalog
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Pin this in boxpilot/theyspy.yaml and BoxPilot's catalog/theyspy.yaml:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMAGE}:${GITHUB_REF_NAME#v}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
