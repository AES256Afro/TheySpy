# BoxPilot catalog manifest for TheySpy (schemaVersion 2), to be proposed as BoxPilot/catalog/theyspy.yaml.
# `npm run check:boxpilot` validates it with BoxPilot's own validateManifest (BOXPILOT_DIR, default ../BoxPilot).
# Port 8797 is free in the BoxPilot catalog (BaselineWatch 8790, Protec 8765, BoxPilot itself 8787).
# M0 runs in bridge mode with no extra capabilities. M4 (network discovery) switches to `network: host`
# with CAP_NET_RAW and CAP_NET_ADMIN, as NetAlertX does, and raises risk to medium.
schemaVersion: 2
id: theyspy
name: TheySpy
category: Security
icon: "🕵️"
description: "Hunts for spyware and ad-intelligence traffic in your Pi-hole log, keeps a list of every device on your network, and shows which CVEs and zero-days apply to each one. Blocklist library with per-device baselines."
website: https://github.com/AES256Afro/TheySpy
risk: low
image:
  reference: ghcr.io/aes256afro/theyspy:0.1.0
  version: "0.1.0"
user: "1000:1000"
ports:
  - id: web
    label: Dashboard
    container: 8797
    host: 8797
    exposure: lan
volumes:
  - id: data
    label: Database, indicator sets and scan history
    container: /data
    path: data
    description: One SQLite file plus downloaded feeds. Restoring it brings back every device, finding and setting.
env:
  - name: TZ
    label: Time zone
    type: timezone
    default: Etc/UTC
  - name: TS_ADMIN_PASSWORD
    label: Owner password
    type: password
    secret: true
    generate: true
    description: Generated by BoxPilot. Needed to sign in.
  - name: TS_SESSION_SECRET
    label: Session signing secret
    type: password
    secret: true
    generate: true
    description: Generated by BoxPilot. Changing it signs everyone out without touching data.
  - name: TS_LOOK
    label: Default look
    description: How every screen is drawn unless a browser chooses otherwise in Settings → Appearance. "auto" keeps each screen's own look.
    default: auto
    options: ["auto", "ops", "light", "pihole", "evidence", "paper", "glass"]
  - name: TS_BRAND_NAME
    label: Name shown in the app
    default: TheySpy
  - name: TS_BRAND_TAGLINE
    label: Tagline (optional)
    default: ""
  - name: TS_ACCENT
    label: Accent colour (optional)
    description: "A colour such as #39c6ff. Empty uses the look's own accent."
    default: ""
  - name: TS_IOC_AUTOCHECK
    label: Check for indicator updates daily
    type: boolean
    default: "true"
    description: Looks for a newer zero-breach indicator set once a day. An update waits on the Indicators screen until you apply it.
signIn:
  path: /
  port: web
  passwordEnv: TS_ADMIN_PASSWORD
  note: There is no username. Change the password here; TheySpy reads it at every start.
health:
  kind: healthcheck
  timeoutSeconds: 120
notes: >-
  Open the dashboard and sign in with the owner password from this card. Settings → Appearance
  picks the look and branding; the defaults for everyone can also be set here. Activity shows
  every job and change. Indicators holds zero-breach's AdFection / Candiru set, checks GitHub daily
  for a signed update (applied only when you approve it) and exports it for DNS filters, MVT and
  MISP. Pi-hole hunting arrives in M2, the blocklist library and baselines in M3,
  network discovery in M4.
