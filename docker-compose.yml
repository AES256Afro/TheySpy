# Standalone: `docker compose up -d`, then open http://<this machine>:8797.
# Without TS_ADMIN_PASSWORD the first start prints a generated password once: `docker compose logs theyspy`.
services:
  theyspy:
    build: .
    image: ghcr.io/aes256afro/theyspy:0.7.0
    restart: unless-stopped
    ports:
      - "8797:8797"
    env_file:
      - path: .env
        required: false
    volumes:
      # A named volume, not ./data: ./data belongs to `npm run dev:server`, and a bind mount would
      # be created root-owned on Linux where the container's node user cannot write to it.
      - theyspy-data:/data

volumes:
  theyspy-data:
